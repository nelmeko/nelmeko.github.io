<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ page.title }} · {{ site.title }}</title>
<meta property="og:title" content="{{ page.title }}">
<meta property="og:image" content="{{ site.url }}/assets/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}#post-{{ page.slug }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body style="background:#060c1f;color:#d6e1fb;font-family:monospace">
<a href="{{ '/' | relative_url }}#post-{{ page.slug }}" style="color:#86b3ff">{{ page.title }} →</a>
</body>
</html>
